name: Site

on:
  push:
    paths:
      - "site/**"
      - "**.md"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - "**.md"
      - ".github/workflows/site.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npm run check:links
