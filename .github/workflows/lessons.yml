name: Lessons

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:4-management
        ports:
          - 5672:5672
        options: >-
          --user 999:999
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20
    env:
      RUNWAY_AMQP_URL: amqp://guest:guest@localhost:5672/
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - uses: astral-sh/setup-uv@v6
      - name: Install the protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Rebuild every lesson guide and run its checks
        run: bash scripts/test_all.sh
