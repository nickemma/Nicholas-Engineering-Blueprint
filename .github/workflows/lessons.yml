name: Lessons

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:4-management
        ports:
          - 5672:5672
        options: >-
          --user 999:999
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: runway
          POSTGRES_PASSWORD: runway
          POSTGRES_DB: runway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U runway"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
      redis-2:
        image: redis:8
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
      redis-3:
        image: redis:8
        ports:
          - 6381:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
      elasticmq: # an SQS stand-in, for Phase 5's SQS adapter
        image: softwaremill/elasticmq-native:1.7.1
        ports:
          - 9324:9324
      kafka:
        image: apache/kafka:4.1.0
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20
    env:
      RUNWAY_AMQP_URL: amqp://guest:guest@localhost:5672/
      RUNWAY_DATABASE_URL: postgres://runway:runway@localhost:5432/runway
      RUNWAY_REDIS_URL: redis://localhost:6379/0
      RUNWAY_REDIS_URLS: redis://localhost:6379/0,redis://localhost:6380/0,redis://localhost:6381/0
      RUNWAY_KAFKA_BROKERS: localhost:9092
      RUNWAY_SQS_ENDPOINT: http://localhost:9324
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-java@v4 # for TLA+ in Phase 4
        with:
          distribution: temurin
          java-version: '21'
      # Phase 5 checks its Helm chart, its Terraform (planned offline, no AWS
      # account) and, through Docker, its Prometheus rules with promtool.
      - uses: azure/setup-helm@v5
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false # plain output: a check greps the plan
      - name: Allow two-phase commit in PostgreSQL
        # Service containers can't be given a command line, so change the
        # setting, then restart the container for it to take effect.
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U runway -c "ALTER SYSTEM SET max_prepared_transactions = 10"
          docker restart ${{ job.services.postgres.id }}
          until docker exec ${{ job.services.postgres.id }} pg_isready -U runway; do sleep 1; done
      - name: Install the protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Rebuild every lesson guide and run its checks
        run: bash scripts/test_all.sh
