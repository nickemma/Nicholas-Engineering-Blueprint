name: Lessons

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - uses: astral-sh/setup-uv@v6
      - name: Check lesson code and test every step
        run: bash scripts/test_all.sh
