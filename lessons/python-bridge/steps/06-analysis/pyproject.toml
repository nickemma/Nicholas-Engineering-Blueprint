[project]
name = "kload"
version = "0.1.0"
description = "Load generation and latency analysis for the KESTREL jobs API"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "matplotlib>=3.9",
    "pandas>=2.2",
]

[project.scripts]
kload = "kload.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
